services:
  # the API also serves the dashboard, built into the same image
  - name: api
    type: web
    region: ohio
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: ENV
        value: production
      - key: RPC_URL
        value: https://eth.merkle.io
      # signs session tokens; generated on first deploy
      - key: JWT_SECRET
        generateValue: true
      # optional, see "Self-hosting: sign-in and SSO" in the README
      - key: OIDC_CLIENT_SECRET
        sync: false
  - name: worker
    type: worker
    region: ohio
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: bun apps/api/cmd/worker.ts
    envVars:
      # the worker loads the same env schema as the api, so share its secret
      - key: JWT_SECRET
        fromService:
          type: web
          name: api
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: ENV
        value: production
      - key: RPC_URL
        value: https://eth.merkle.io

  - name: marketing
    type: web
    runtime: static
    # static sites build with Node, so Bun is fetched from npm
    buildCommand: npx --yes bun@1.4.4 install --frozen-lockfile && npx --yes bun@1.4.4 run --filter @accounting/marketing build
    staticPublishPath: ./apps/marketing/dist
    envVars:
      # public URL of the api service (which serves the dashboard), where the sign up buttons point
      - key: VITE_APP_URL
        sync: false

databases:
  - name: db
    plan: basic-256mb
    region: ohio
    # no outside access; add `- source: <your ip>/32` entries to connect from your machine
    ipAllowList: []
